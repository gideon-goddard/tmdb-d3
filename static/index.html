<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actor Connection Finder</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Actor Connection Finder</h1>
            <p>Find the connections between any two actors using TMDB data</p>
        </header>
        
        <div class="controls">
            <div class="input-group">
                <div class="input-field">
                    <label for="actor1">First Actor:</label>
                    <div class="autocomplete-container">
                        <input type="text" id="actor1" placeholder="e.g., Kevin Bacon" autocomplete="off">
                        <div class="autocomplete-dropdown" id="actor1-dropdown"></div>
                    </div>
                </div>
                
                <div class="input-field">
                    <label for="actor2">Second Actor:</label>
                    <div class="autocomplete-container">
                        <input type="text" id="actor2" placeholder="e.g., Tom Hanks" autocomplete="off">
                        <div class="autocomplete-dropdown" id="actor2-dropdown"></div>
                    </div>
                </div>
                
                <div class="input-field">
                    <label for="searchDepth">Max Depth:</label>
                    <select id="searchDepth">
                        <option value="1">1 (Direct connections only)</option>
                        <option value="2" selected>2 (Up to 1 intermediary)</option>
                        <option value="3">3 (Up to 2 intermediaries)</option>
                        <option value="4">4 (Up to 3 intermediaries)</option>
                    </select>
                </div>
                
                <button id="searchBtn" onclick="findConnections()">Find Connections</button>
            </div>
            
            <div class="path-selector" id="pathSelector" style="display: none;">
                <label for="pathDropdown">Highlight Path:</label>
                <select id="pathDropdown" onchange="highlightPath()">
                    <option value="">Select a path to highlight</option>
                </select>
            </div>
            
            <div class="status" id="status">
                Enter two actor names to find their connections
            </div>
            
            <div class="progress-container" id="progressContainer" style="display: none;">
                <div class="progress-info">
                    <span id="progressMessage">Processing...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-details" id="progressDetails"></div>
            </div>
        </div>
        
        <div class="visualization-container">
            <svg id="graph"></svg>
            
            <div class="visualization-controls">
                <button id="fitToScreenBtn" class="viz-control-btn" onclick="fitToScreen()" title="Fit to Screen">
                    📐 Fit to Screen
                </button>
                <button id="saveImageBtn" class="viz-control-btn" onclick="saveAsImage()" title="Save as High Quality Image">
                    💾 Save Image
                </button>
            </div>
            
            <div class="legend">
                <h3>Legend</h3>
                <div class="legend-item">
                    <div class="legend-color search-actor"></div>
                    <span>Search Actors</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color movie"></div>
                    <span>Movies</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color cast-member"></div>
                    <span>Cast Members</span>
                </div>
            </div>
        </div>
        
        <div class="path-list-container" id="pathListContainer" style="display: none;">
            <h3>🛤️ Connection Paths (ordered by degree)</h3>
            <div class="path-list" id="pathList">
                <!-- Paths will be populated here -->
            </div>
        </div>
    </div>
    
    <script src="static/script.js"></script>
</body>
</html>
